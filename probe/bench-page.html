<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>bench · long page</title>
  <style>
    body { margin: 0; background: #fff; color: #222; font: 16px/1.8 system-ui, sans-serif; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 40px 24px 120px; }
    section { height: 900px; border-bottom: 1px solid #ddd; padding-top: 40px; }
    .inner { height: 700px; overflow-y: auto; border: 1px solid #ccc; padding: 12px; margin-top: 20px; }
    .inner p { margin: 0 0 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Scroll benchmark page</h1>
    <p>A long page: the outer document scrolls. The nested container sits in the last section so the pointer does not land on it while scrolling.</p>
    <section><h2>01</h2></section>
    <section><h2>02</h2></section>
    <section><h2>03</h2></section>
    <section><h2>04</h2></section>
    <section><h2>05</h2></section>
    <section><h2>06</h2></section>
    <section><h2>07</h2></section>
    <section><h2>08</h2></section>
    <section><h2>09</h2></section>
    <section id="last"><h2>10</h2>
      <div class="inner" id="inner">
        <p>Inner scroll container, used to verify nested scrolling is not stolen by the outer page.</p>
        <p style="height:2000px">…</p>
      </div>
    </section>
  </div>
  <script src="../app/webOSUserScripts/userScript.js"></script>
</body>
</html>
