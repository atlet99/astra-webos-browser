    <p>凌晨两点十七分，望远镜指向天鹅座方向的第三块空白。数据流回来的第一帧没有星，只有一层很薄的噪点，像旧电视机的雪花。</p>
    <figure>
      <div class="hero"></div>
      <figcaption>FIG 1 — 累积曝光 40 分钟，未做暗场校正</figcaption>
    </figure>
    <blockquote>“如果连续三晚都是噪点，那说明我们找错了方向，而不是望远镜坏了。”</blockquote>
    <p>控制室的空调声比往常大。值班表上写着四个名字，实际只有两个人在。剩下的两个位置留给了咖啡杯和一台还在跑校准的笔记本。</p>
