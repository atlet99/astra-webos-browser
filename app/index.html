<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>ASTRA</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="browser">
    <header id="chrome">
      <div class="tabstrip">
        <div id="tabs" class="tabs" role="tablist" aria-label="Tab"></div>
        <button id="newTabBtn" class="tabplus" type="button" data-icon="plus" title="New tab (Ctrl+T)" aria-label="New tab" data-i18n-attr="title:panel.newTab;aria-label:panel.newTab"></button>
      </div>
      <div class="toolbar">
        <div class="nav-group">
          <button id="backBtn" class="icon-btn" type="button" data-icon="back" title="Back (Alt+←)" aria-label="Back" data-i18n-attr="title:chrome.back;aria-label:chrome.back" disabled></button>
          <button id="forwardBtn" class="icon-btn" type="button" data-icon="forward" title="Forward (Alt+→)" aria-label="Forward" data-i18n-attr="title:chrome.forward;aria-label:chrome.forward" disabled></button>
          <button id="reloadBtn" class="icon-btn" type="button" data-icon="reload" title="Reload (F5)" aria-label="Reload" data-i18n-attr="title:chrome.reload;aria-label:chrome.reload"></button>
          <button id="homeBtn" class="icon-btn" type="button" data-icon="home" title="Home" aria-label="Home" data-i18n-attr="title:chrome.home;aria-label:chrome.home"></button>
        </div>
        <form id="omnibox" class="omnibox" autocomplete="off">
          <span id="securityIcon" class="security" aria-hidden="true"></span>
          <input id="addressInput" type="text" inputmode="url" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Enter URL or search" aria-label="Address bar" data-i18n-attr="placeholder:addr.placeholder;aria-label:addr.label">
          <button class="go-btn" type="submit" data-icon="arrow" title="Open" aria-label="Open" data-i18n-attr="title:chrome.open;aria-label:chrome.open"></button>
        </form>
        <button id="bookmarkBtn" class="icon-btn star-btn" type="button" data-icon="star" title="Add bookmark (Ctrl+D)" aria-label="Bookmark" data-i18n-attr="aria-label:chrome.bookmark"></button>
        <button id="menuBtn" class="icon-btn" type="button" data-icon="menu" title="Menu" aria-label="Menu" data-i18n-attr="title:chrome.menu;aria-label:chrome.menu"></button>
      </div>
    </header>

    <main id="newtab" class="newtab">
      <div class="ntp-wrap">
        <div class="rail">
          <div class="rail-id">
            <span class="rail-mark" aria-hidden="true"></span>
            <span class="wordmark">ASTRA</span>
            <span id="greeting" class="rail-sub" data-i18n="ntp.terminal">Star-chart terminal</span>
          </div>
          <div class="rail-data">
            <span class="datum"><b id="tNet">—</b><i data-i18n="rail.net">NET</i></span>
            <span class="datum"><b id="tTabs">—</b><i data-i18n="rail.tabs">TABS</i></span>
            <span class="datum"><b id="tSvc">—</b><i data-i18n="rail.svc">SVC</i></span>
            <span class="datum datum-clock"><b id="clock">--:--</b><i data-i18n="rail.local">LOCAL</i></span>
          </div>
        </div>

        <section class="deck">
          <form id="ntpSearch" class="cmd" autocomplete="off">
            <span class="cmd-icon" data-icon="search" aria-hidden="true"></span>
            <label class="cmd-label" for="ntpInput" data-i18n="ntp.input">Input</label>
            <input id="ntpInput" type="text" inputmode="search" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="URL or search term" aria-label="Enter URL or search" data-i18n-attr="placeholder:ntp.placeholder;aria-label:addr.placeholder">
            <button class="cmd-go" type="submit" data-i18n="ntp.open">Open</button>
          </form>
          <p class="cmd-hint">
            <kbd>Ctrl</kbd><kbd>L</kbd> <span data-i18n="ntp.hintFocus">Focus</span>
            <span class="sep">·</span><kbd>Enter</kbd> <span data-i18n="ntp.hintOpen">Open</span>
            <span class="sep">·</span><kbd>↑</kbd><kbd>↓</kbd> <span data-i18n="ntp.hintSelect">Select target</span>
            <span class="sep">·</span><kbd>F11</kbd> <span data-i18n="ntp.hintFull">Fullscreen</span>
          </p>
        </section>

        <section class="block">
          <div class="block-head">
            <h2 data-i18n="ntp.targets">Targets</h2>
            <span id="targetsMeta" class="meta">Checking…</span>
          </div>
          <div id="quicklinks" class="targets"></div>
        </section>

        <section class="block">
          <div class="block-head">
            <h2 data-i18n="ntp.bookmark">Bookmark</h2>
            <span id="bookmarkCount" class="meta"></span>
          </div>
          <div id="bookmarkGrid" class="rows two"></div>
        </section>

        <section class="block">
          <div class="block-head">
            <h2 data-i18n="ntp.recent">Recent</h2>
            <button id="allHistoryBtn" class="mini" type="button" data-i18n="ntp.allHistory">All history</button>
          </div>
          <div id="historyGrid" class="rows two"></div>
        </section>

        <footer class="ntp-footer">
          <span id="serviceStatus"><span class="led"></span> Connecting to browsing state service</span>
          <span class="foot-hint" data-i18n="ntp.footHint">Works with arrow keys / mouse / remote · Esc closes the panel</span>
        </footer>
      </div>

      <section id="state" class="state" hidden aria-live="assertive"></section>
    </main>
  </div>

  <div id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" hidden>
    <div class="panel-head">
      <h3 id="panelTitle" data-i18n="panel.menu">Menu</h3>
      <button id="panelClose" class="x" type="button" data-icon="close" aria-label="Close" data-i18n-attr="aria-label:chrome.close"></button>
    </div>
    <div id="panelBody" class="panel-body"></div>
    <div id="panelActions" class="panel-actions" hidden></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="config.js"></script>
  <script src="i18n/en-US.js"></script>
  <script src="i18n/en-GB.js"></script>
  <script src="i18n/ru.js"></script>
  <script src="i18n/kk.js"></script>
  <script src="i18n/uz.js"></script>
  <script src="i18n/zh-CN.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
